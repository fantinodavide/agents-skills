name: style-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/style_lint.py --selftest
      - run: python3 scripts/style_lint.py skills/*/SKILL.md skills/*/references/*.md README.md
