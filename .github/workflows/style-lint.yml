name: style-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/style_lint.py --selftest
      - run: python3 scripts/sync_rules.py --selftest
      - run: python3 scripts/sync_rules.py --check
      - run: python3 evaluations/technical-docs/check_fixture.py
      - run: python3 scripts/style_lint.py rules/*.md skills/todo-list/SKILL.md README.md
      - run: python3 scripts/style_lint.py --profile documentation skills/technical-docs/SKILL.md skills/technical-docs/references/*.md
      - run: python3 scripts/style_lint.py --profile conversation skills/clear-output-style/SKILL.md
